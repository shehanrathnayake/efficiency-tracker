name: Weekly summary
on:
  schedule:
    - cron: '0 8 * * MON'
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate and post weekly summary
        run: |
          MERGED=$(gh pr list --state merged --limit 20 \
            --json title,mergedAt,additions,deletions \
            --jq '.[] | select(.mergedAt > (now - 604800 | strftime("%Y-%m-%dT%H:%M:%SZ"))) | "- " + .title + " (+" + (.additions|tostring) + "/-" + (.deletions|tostring) + ")"')

          OPEN=$(gh issue list --state open --limit 10 \
            --json title --jq '.[] | "- " + .title')

          SUMMARY=$(curl -s \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"contents\": [{
                \"parts\": [{
                  \"text\": \"Write a concise weekly engineering summary.\n\nMerged PRs:\n${MERGED}\n\nOpen issues:\n${OPEN}\"
                }]
              }]
            }" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data['candidates'][0]['content']['parts'][0]['text'])
          ")

          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "content-type: application/json" \
            -d "{\"text\": \"*Weekly engineering summary* 📊\n${SUMMARY}\"}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}